<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Web Motion Showcase — 克制的网页动效灵感库</title>
  <desc id="desc">浅色标题：Web Motion Showcase，副标题 60 个克制、可复用的 UI 动效；右侧是一张 3D 倾斜的卡片与一条缓动曲线。</desc>

  <rect width="1200" height="360" rx="26" fill="#f8fafc"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#2563eb">MOTION HUB · WEB UI MOTION GALLERY</text>
    <text x="56" y="128" font-size="54" font-weight="700" fill="#0f172a">Web Motion Showcase</text>
    <text x="56" y="168" font-size="23" fill="#0f172a">网页动效灵感库 — 60 个克制、可复用的 UI 动效</text>
    <text x="56" y="204" font-size="19" fill="#55677e">每条都有交互沙盒、中英双语说明与 AI 开发提示词。</text>
    <g id="chips" font-size="18" fill="#0f172a" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="119" y="262">60 个动效</text></g>
      <g><rect x="194" y="238" width="112" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="250" y="262">6 大分类</text></g>
      <g><rect x="318" y="238" width="168" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="402" y="262">3 主题 × 深浅</text></g>
      <g><rect x="498" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="561" y="262">AI 提示词</text></g>
    </g>
  </g>

  <g id="motion-motif">
    <g id="easing-curve">
      <path d="M 800 308 C 880 308, 920 132, 1080 92" fill="none" stroke="#bfdbfe" stroke-width="10" stroke-linecap="round"/>
      <path d="M 800 308 C 880 308, 920 132, 1080 92" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="800" cy="308" r="8" fill="#2563eb"/>
      <circle cx="884" cy="252" r="6" fill="#60a5fa"/>
      <circle cx="956" cy="168" r="6" fill="#60a5fa"/>
      <circle cx="1080" cy="92" r="8" fill="#2563eb"/>
    </g>
    <g id="tilt-card" transform="translate(950 190) rotate(-8)">
      <polygon points="-70,-50 90,-50 110,50 -50,50" fill="#dbeafe"/>
      <polygon points="-90,-30 70,-30 90,70 -70,70" fill="#2563eb"/>
      <polygon points="-78,-18 58,-18 66,58 -70,58" fill="#3b82f6"/>
      <circle cx="0" cy="20" r="16" fill="#ffffff" opacity="0.92"/>
      <polygon points="-5,12 -5,28 10,20" fill="#2563eb"/>
    </g>
  </g>
</svg>
